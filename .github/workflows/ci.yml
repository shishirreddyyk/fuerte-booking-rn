name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version is taken from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @fuerte/shared --filter @fuerte/db build

      - name: Typecheck
        run: pnpm --filter @fuerte/shared --filter @fuerte/db --filter @fuerte/api typecheck

      - name: Test
        run: pnpm --filter @fuerte/shared test
